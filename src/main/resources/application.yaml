spring:
  application:
    name: flora-sense
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  #Maximum uploaded image size
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET} #i put JWT_SECRET key in Environement variable. to protect Unauthorized access.

plantnet:
  api:
    url: https://my-api.plantnet.org/v2/identify
    key: ${PLANTNET_API_KEY} #i put PLANT_API_KEY in Environment Variable. Edit Configuration -> Modify Option -> Select Environment Variable
    project: ${PLANTNET_PROJECT:all}

#Local Image storage
app:
  upload:
    plants-dir: uploads/plants


